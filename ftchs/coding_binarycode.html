<!DOCTYPE html>
<html lang="en">
<head>
  <title>FTCHS, Coding - Binary Code</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<div class="container-fluid p-5 bg-primary text-white text-center">
  <h1>Binary Code Converter</h1>
  <h2>Type in 0s and 1s to convert binary code of a byte (8 bits) into a decimal number from 0 to 255.</h2> 
</div>
  
<div class="container mt-5">
  <div class="row">
    <div class="col-sm-12">
      <h3>Input 0s and 1s</h3>
      <p>
        <input required pattern="[01]" minlength="1" value="0" maxlength="1"  size="10px" id="bit7" type="text"/>
        <input value="0" maxlength="1" pattern="[0-1]+" inputmode="numeric" size="10px" id="bit6" type="text"/>
        <input value="0" maxlength="1" pattern="[0-1]+" inputmode="numeric"  size="10px" id="bit5" type="text"/>
        <input value="0" maxlength="1" pattern="[0-1]+" inputmode="numeric" size="10px" id="bit4" type="text"/>
        <input value="0" maxlength="1" pattern="[0-1]+" inputmode="numeric" size="10px" id="bit3" type="text"/>
        <input value="0" maxlength="1" pattern="[0-1]+" inputmode="numeric" size="10px" id="bit2" type="text"/>
        <input value="0" maxlength="1" pattern="[0-1]+" inputmode="numeric" size="10px" id="bit1" type="text"/>
        <input value="0" maxlength="1" pattern="[0-1]+" inputmode="numeric" size="10px" id="bit0" type="text"/>
      </p>
      <div>
        <button onclick="calc()" id="btnCalc" class="btn btn-lg btn-success">Calculate</button>
        <button onclick="clear1()" id="btnClear" class="btn btn-lg btn-danger">Clear</button>
        <h1 id="sumDec">0</h1>

      </div>
    </div>
  </div>
</div>

<script>
  let sum = 0;

  function clear1(){
    console.log("in clear")
    $("input").val("0");

    sum = 0;

    $('#sumDec').html(sum);
  }

  function calc(){
    console.log(sum)
    sum = 0;
    console.log(sum)
    if($('#bit7').val() == 1){
      sum += 128
    }

    if($('#bit6').val() == 1){
      sum += 64
    }

    if($('#bit5').val() == 1){
      sum += 32
    }

    if($('#bit4').val() == 1){
      sum += 16
    }

    if($('#bit3').val() == 1){
      sum += 8
    }

    if($('#bit2').val() == 1){
      sum += 4
    }

    if($('#bit1').val() == 1){
      sum += 2
    }

    if($('#bit0').val() == 1){
      sum += 1
    }


    
    //place on GUI
    $('#sumDec').html(sum);
  }
</script>
</body>
</html>
