<!DOCTYPE html>
<html lang="en">
<head>
  <title>Euro Flags - Lesson 1 - FTCHS</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container-fluid p-5 bg-primary text-white text-center">
  <h1>Euro Flag Tri Colors</h1>
  <h2>Click the buttons below to see different flag colors</h2>
  <p>Resize this responsive page to see the effect!</p> 
</div>
  
<div class="container mt-5">
  <div class="row">
    <div id="col1" class="col-sm-4">
      <h3>Column 1</h3>
      <p></p>
      <p></p>
    </div>
    <div id="col2" class="col-sm-4">
      <h3>Column 2</h3>
      <p></p>
      <p></p>
    </div>
    <div id="col3" class="col-sm-4">
      <h3>Column 3</h3>        
      <p></p>
      <p></p>
    </div>
  </div>
   <button onclick="changeFrench()">French Flag</button>
      <button onclick="changeIrish()">Irish Flag</button>
      <button onclick="changeBelgian()">Belgian Flag</button>
      <button onclick="changeItalian()">Italian Flag</button>
</div>

<script>
  let col1 = document.querySelector('#col1');
  let col2 = document.querySelector('#col2');
  let col3 = document.querySelector('#col3');
  

  function changeFrench(){
    col1.style.backgroundColor = 'blue'
    col2.style.backgroundColor = 'white'
    col3.style.backgroundColor = 'red'
  }

  function changeItalian(){
    col1.style.backgroundColor = 'green'
    col2.style.backgroundColor = 'white'
    col3.style.backgroundColor = 'red'
  }

  function changeIrish(){
    col1.style.backgroundColor = 'green'
    col2.style.backgroundColor = 'white'
    col3.style.backgroundColor = 'orange'
  }

  function changeBelgian(){
    col1.style.backgroundColor = 'black'
    col2.style.backgroundColor = 'yellow'
    col3.style.backgroundColor = 'red'
  }

</script>
</body>
</html>
