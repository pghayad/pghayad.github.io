<!DOCTYPE html>
<html>
<head>
    <title>Lilly Reckers Study Page - SAT - Ivy Experience</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
    <style>
        body {
            background-color: pink;
        }

        h1, h2 {
            color: blueviolet;
        }
    </style>
    
</head>
<body>

<h1>Lilly's SAT Study Page - Ivy Experience</h1>
<h1 id="word"></h1>
<h2 id="definition"></h2>
<button id="btnVocab" onclick="doVocab()">Vocabulary</button>


<script>
    let words = ['abate', 'abdicate', 'aberration', 'abhor', 'abstain', 'abstruse',
        'inevitable', 'fortuitously', 'provoke', 'vex', 'perennially', 'benign',
        'banal', 'acumen', 'aloof', 'debauchery', 'incite', 'tenet', 'edict', 'precipitate', 'forestall',
        'rancor', 'ostensibly', 'haughty'
    ];

    let definitions = [
        'lessen, reduce', 'resign, give up, surrender', 'anomaly, something that stands out from the rest',
        'detest, hate', 'refrain from doing', 'complex, difficult to understand', 'definitely going to happen', 'luckily, positively',
        'irk, vex, irritate, annoy', 'irk, irriate, provoke', 'lasting forever, infinitely', 'harmless',
        'boring, trite, commonplace', 'shrewdness, cunning, clever, smart', 'not grounded, wayward', 
        'outlandish or sinful behavior', 'start up, generate', 'principle, order', 'law, decree', 
        'come before (an event)', 'stall, distract', 'hatred, bitterness', 'outwardly showing a way, but inside may feel different',
        'showy, grandiose, arrogant'
    ]

    let counter = 0;

    function doVocab(){

        document.querySelector('#word').innerHTML=words[counter];
        document.querySelector('#definition').innerHTML=definitions[counter];
        document.querySelector('#btnVocab').innerHTML='Next';
        
        if(counter == words.length-1){
            document.querySelector('#btnVocab').innerHTML='Done';
            document.querySelector('#btnVocab').disabled=true;
        }else{
            counter++;
        }
        
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
