     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

<h1>Aarya's ACT Study Page - Ivy Experience</h1>
<h1 id="word"></h1>
<h2 hidden id="definition"></h2>
<button id="btnVocab" onclick="doVocab()">English</button>
<button hidden id="btnGrammar" onclick="doMath()">Math</button>
<button hidden id="btnMainMenu" onclick="returnToMain()">Return To Main Menu</button>
<button hidden id="btnReading" onclick="showReading()">Reading</button>
<button hidden id="btnScience" onclick="showScience()">Science</button>

<button hidden id="btnDef" onclick="showDef()">Show Definition</button>
<button hidden disabled id="btnBack" onclick="back()">Back</button>
<button hidden id="btnNext" onclick="next()">Next</button>
<div>

</div>
<div>

    <button class="btn btn-lg btn-warning"><a target='_blank' href="docs/Ratios_3_Math.pdf" download>Ratios Study Sheet</a></button>
        <button class="btn btn-lg btn-warning"><a target='_blank' href="docs/Advanced_Ratios_Math.pdf" download>Advanced Ratios Study Sheet</a></button>
    <button class="btn btn-lg btn-warning"><a target='_blank' href="docs/ACT_Math_flashcards.pdf" download>Math Flashcards</a></button>
    
    <h2>Downloads of ACT English Study Sheets</h2>
    <button class="btn btn-lg btn-warning"><a target='_blank' href="docs/GrammarReview_LillyR_08192026.pdf" download>English Grammar Review</a></button>

    <h2>Downloads of ACT Practice Tests</h2>
        <button class="btn btn-lg btn-warning"><a target='_blank' href="docs/ACT_F2_Test.pdf" download>ACT Practice Test F2</a></button>
        <button class="btn btn-lg btn-warning"><a target='_blank' href="docs/ACT_F3_Test.pdf" download>ACT Practice Test F3</a></button>

</div>

<script>
   let words = ['rudimentary', 'scathing', 'zenith', 'cantankerous', 'beacon',
        'supposition', 'jovial', 'predecessor', 'quandary', 'quagmire', 
        'innocuous','fastidious', 'tepid', 'paragon', 'prototypical', 
        'abate', 'abdicate', 'aberration', 'abhor', 'abstain', 'abstruse',
        'inevitable', 'fortuitously', 'provoke', 'vex', 'perennially', 'benign',
        'banal', 'acumen', 'aloof', 'debauchery', 'incite (-)', 'tenet', 'edict', 'precipitate', 'forestall',
        'rancor', 'ostensibly', 'haughty', 'adulation', 'adversity', 'amicable', 'antagonist'

    ];

    let definitions = [
        'elementary, basic', 'a scathing review of a movie is one that rips it apart! (-)', 'peak, pinnacle',
        'wild, unruly', 'a beacon of hope is something that represents hope',
        'theory, claim', 'friendly, kind', 'something coming before', 'difficult situation', 'quandary, tough situation',
        'harmless, benign','difficult to please, stubborn', 'lukewarm, lacking energy', 'epitome, exemplar, perfect example of something good',
         'quintessential, archetypal', 
        'lessen, reduce', 'resign, give up, surrender', 'anomaly, something that stands out from the rest',
        'detest, hate', 'refrain from doing', 'complex, difficult to understand', 'definitely going to happen', 'luckily, positively',
        'irk, vex, irritate, annoy', 'irk, irritate, provoke', 'lasting forever, infinitely', 'harmless, innocuous',
        'boring, trite, commonplace', 'shrewdness, cunning, clever, smart', 'not grounded, wayward', 
        'outlandish or sinful behavior', 'start up, generate', 'principle, order', 'law, decree', 
        'come before (an event)', 'stall, distract', 'hatred, bitterness', 'outwardly showing a way, but inside may feel different',
        'showy, grandiose, arrogant', 'flattery, praise, admiration', 'hardship, misfortune', 'friendly, agreeable, cordial',
        'opponent, adversary, rival'
    ]

    let counter = 0;
    let showMainMenu = false;

    function doEnglish(){

    }

    function showReading(){

    }

    function showScience(){

    }

    function doGrammar(){
        document.querySelector('#word').innerHTML='A semicolon (;) separates two complete sentences.<br><br>'+
        'Example: Jess was sick yesterday; nevertheless, she still did well on her science exam.<br><br>'+
        'A comma (,) can also separate two complete sentences with the words: and, but, yet, so.<br><br>'+
        'Example: John was an athlete, so he liked running around.'
        document.querySelector('#btnMainMenu').hidden=false;
        document.querySelector('#btnGrammar').hidden=true;
        document.querySelector('#btnVocab').hidden=true;
        document.querySelector('#btnTrans').hidden=true;
    }

    function returnToMain(){
        
        document.querySelector('#btnMainMenu').hidden=true;
        document.querySelector('#btnGrammar').hidden=true;
        document.querySelector('#btnDef').hidden=true;
        document.querySelector('#definition').hidden=true;
        document.querySelector('#btnVocab').hidden=false;
        document.querySelector('#btnBack').hidden=true;
        document.querySelector('#btnNext').hidden=true;
        document.querySelector('#word').innerHTML=''
    }
    function show(){
        document.querySelector('#btnGrammar').hidden=true;
        console.log(showMainMenu)
        if(!showMainMenu){
            document.querySelector('#btnTrans').innerHTML='Return to Main Menu';
            document.querySelector('#word').innerHTML='Contrast Words: although, even though, nevertheless, despite, however,' + 
        'on the other hand<br><br>Example: Although she was a fast sprinter, Laura was slow at long-distance running.'
        +'<br><br>John did great at the Math section of the SAT; however, his Reading performance was atrocious.'
        
        +'<br><br>Conclusion Words: thus, therefore, ergo, hence<br><br>It was raining; thus, Jill took her umbrella to work.'
            showMainMenu=true;
            document.querySelector('#btnVocab').hidden=true;
            document.querySelector('#btnGrammar').hidden=true;
        }else{
            document.querySelector('#btnVocab').hidden=false;
            document.querySelector('#btnGrammar').hidden=false;
            showMainMenu=false;
            document.querySelector('#word').innerHTML=''
            document.querySelector('#btnTrans').innerHTML='Transition Words';
        }
        
    }

    function showDef(){
        if(document.querySelector('#definition').hidden == true){
            document.querySelector('#definition').hidden=false;
            document.querySelector('#btnDef').innerHTML='Hide Definition'
        }else{
            document.querySelector('#definition').hidden=true;
            document.querySelector('#btnDef').innerHTML='Show Definition'
        }
            
    }

    function doVocab(){
        document.querySelector('#btnGrammar').hidden=true;
        document.querySelector('#btnMainMenu').hidden=false;
        //document.querySelector('#btnTrans').hidden=true;
        document.querySelector('#btnVocab').hidden=true;
        document.querySelector('#btnBack').hidden=false;
        document.querySelector('#btnNext').hidden=false;
        document.querySelector('#btnDef').hidden=false;
        document.querySelector('#word').innerHTML=words[counter];
        document.querySelector('#definition').innerHTML=definitions[counter];
    }

    function back(){
        console.log('back: ' + counter)
        if(counter > 0)
            counter--;
        document.querySelector('#word').innerHTML=words[counter];
        document.querySelector('#definition').innerHTML=definitions[counter];
        document.querySelector('#btnNext').disabled=false;

        if(counter == 0){
            document.querySelector('#btnBack').disabled=true;
        }else{
            //counter--;
        }
    }

    function next(){
        console.log('next: ' + counter)
        counter++;
        document.querySelector('#word').innerHTML=words[counter];
        document.querySelector('#definition').innerHTML=definitions[counter];
        document.querySelector('#btnBack').disabled=false;
        
        if(counter == 0){
            document.querySelector('#btnBack').disabled=true;
        }else if(counter == words.length-1){
            document.querySelector('#btnNext').disabled=true;
            //counter++;
        }else{
            document.querySelector('#btnNext').disabled=false;
        }
        
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
